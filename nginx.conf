# Cấu hình Nginx mẫu cho Woashe Bloom (đặt tại /etc/nginx/sites-available/woashe-bloom)

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Tự động chuyển hướng sang HTTPS sau khi cài SSL Certbot
    # (Certbot sẽ tự động chèn hoặc mở port 443)

    client_max_body_size 20M;

    # Nén Gzip tăng tốc tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy toàn bộ request vào Node.js (cổng 9090)
    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
